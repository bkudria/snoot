name: Bug report
description: Report something snoot does wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal command(s) and inputs that trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected snoot to do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What snoot did instead (full output, exit code, stderr).
    validations:
      required: true
  - type: input
    id: snoot-version
    attributes:
      label: snoot version
      description: Output of `snoot --version`.
    validations:
      required: true
  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      description: Output of `ruby --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 15.2, Ubuntu 24.04.
    validations:
      required: true
