# RuboCop is snoot's linter and formatter. See CLAUDE.md for commands.

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Aligned with reek's UncommunicativeVariableName: prefer a descriptive name
# over the default `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error
